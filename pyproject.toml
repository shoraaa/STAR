[project]
name = "STAR"
version = "0.1.0"
description = "STAR: Scoped Test-time Adaptation and Refinement for Neural Routing Solvers"
readme = "README.md"
requires-python = ">=3.8,<3.14"
dependencies = [
    "numpy",
    "pybind11",
    "cython",
    "vrplib",
    "torch",
    "torchvision",
    "tqdm",
    "entmax>=1.3",
    "scipy",
    "pandas>=2.0.3",
    "jax>=0.4.13",
    "torch-cluster>=1.6.3",
    "tensorboard-logger>=0.1.0",
    "pytz>=2026.2",
    "matplotlib>=3.7.5",
    "pyyaml>=6.0.3",
    "tensorflow",
    "torch_geometric",
    "flax",
    "torch_cluster",
    "pytorch_lightning",
]

[build-system]
requires = ["setuptools>=45", "wheel", "cython", "pybind11"]
build-backend = "setuptools.build_meta"

[tool.uv.extra-build-dependencies]
torch-cluster = ["torch"]
